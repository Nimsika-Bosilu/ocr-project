apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  labels:
    {{- include "ocr-project.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount.gateway }}

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway
        {{- include "ocr-project.labels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "ocr-project.serviceAccountName" . }}
      automountServiceAccountToken: true

      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}

      containers:
        - name: api-gateway

          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"

          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}

          envFrom:
            - configMapRef:
                name: api-gateway-config

          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}