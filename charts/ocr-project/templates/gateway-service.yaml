apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  labels:
    app: api-gateway
    {{- include "ocr-project.labels" . | nindent 4 }}

spec:
  type: {{ .Values.gateway.service.type }}

  selector:
    app: api-gateway

  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP