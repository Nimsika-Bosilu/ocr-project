apiVersion: apps/v1
kind: Deployment

metadata:
  name: ocr-model
  labels:
    {{- include "ocr-project.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount.model }}

  selector:
    matchLabels:
      app: ocr-model

  template:
    metadata:
      labels:
        app: ocr-model
        {{- include "ocr-project.labels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "ocr-project.serviceAccountName" . }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001

      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}

      containers:
        - name: ocr-model

          image: "{{ .Values.model.image.repository }}:{{ .Values.model.image.tag }}"

          ports:
            - name: http
              containerPort: {{ .Values.model.service.port }}

          envFrom:
            - configMapRef:
                name: ocr-model-config

          livenessProbe:
            httpGet:
              path: {{ .Values.model.probes.livenessPath }}
              port: http

          readinessProbe:
            httpGet:
              path: {{ .Values.model.probes.readinessPath }}
              port: http

          resources:
            {{- toYaml .Values.model.resources | nindent 12 }}