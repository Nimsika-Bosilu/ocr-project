apiVersion: v1
kind: Service

metadata:
  name: ocr-model
  labels:
    app: ocr-model
    {{- include "ocr-project.labels" . | nindent 4 }}

spec:
  type: {{ .Values.model.service.type }}

  selector:
    app: ocr-model

  ports:
    - name: http
      port: {{ .Values.model.service.port }}
      targetPort: http
      protocol: TCP