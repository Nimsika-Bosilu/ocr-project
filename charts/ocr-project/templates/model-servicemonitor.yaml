{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ocr-model
  labels:
    {{- include "ocr-project.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: ocr-model
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.model.path }}
      interval: {{ .Values.serviceMonitor.model.interval }}
{{- end }}