apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: ocr-config-reader
  labels:
    {{- include "ocr-project.labels" . | nindent 4 }}

rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - ocr-model-config
      - api-gateway-config
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: ocr-config-reader
  labels:
    {{- include "ocr-project.labels" . | nindent 4 }}

subjects:
  - kind: ServiceAccount
    name: {{ include "ocr-project.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ocr-config-reader