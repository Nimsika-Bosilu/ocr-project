services:
  api-gateway:
    build: ./services/api-gateway
    image: nimsikapickme/ocr-project:api-gateway-v4
    ports:
      - "8001:8001"
    depends_on:
      - ocr-model-container

  ocr-model-container:
    build: ./services/ocr-model
    image: nimsikapickme/ocr-project:ocr-model-v2
    ports:
      - "8080:8080"
